{% extends "base.html" %}

{% block title %}Create User - Hospital System{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <!-- Card Container -->
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white text-center">
                <h4>Create New User</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <!-- First Name -->
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" name="first_name" placeholder="Enter first name" required>
                    </div>

                    <!-- Last Name -->
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" name="last_name" placeholder="Enter last name" required>
                    </div>

                    <!-- Username -->
                   <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required>
                        <small id="usernameFeedback" class="form-text"></small>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" placeholder="Enter email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="phone" class="form-control" name="phone" placeholder="Enter Phone number" required>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                    </div>

                    <!-- Role -->
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select" required>
                            {% for r in roles %}
                                <option value="{{ r }}">{{ r|capfirst }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Create User</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center text-muted">
                Hospital Management System
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const usernameInput = document.getElementById("username");
    const feedback = document.getElementById("usernameFeedback");

    usernameInput.addEventListener("input", function() {
        const username = usernameInput.value.trim();
        if (username.length === 0) {
            feedback.textContent = "";
            return;
        }

        fetch(`/check-username/?username=${encodeURIComponent(username)}`)
            .then(response => response.json())
            .then(data => {
                if (data.exists) {
                    feedback.textContent = "⚠️ Username already exists.";
                    feedback.style.color = "red";
                } else {
                    feedback.textContent = "✅ Username is available.";
                    feedback.style.color = "green";
                }
            })
            .catch(error => {
                console.error("Error checking username:", error);
            });
    });
});
</script>
{% endblock %}
