{% extends "base.html" %}
{% block title %}Edit Patient{% endblock %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Patient Details</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <!-- Patient User Info (Read Only) -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" value="{{ patient.user.username }}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" value="{{ patient.user.get_full_name }}" readonly>
                    </div>
                </div>

                <!-- Editable Fields -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label"></label>
                        Age<input type="number" name="age" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-select" required>
                            <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ patient.phone }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2">{{ patient.address }}</textarea>
                    </div>
                </div>

               
                <!-- Buttons -->
                <div class="d-flex justify-content-end">
                    <a href="" class="btn btn-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
