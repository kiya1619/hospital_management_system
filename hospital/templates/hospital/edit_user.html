{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Edit User: {{ edit_user.username }}</h2>
    {% if not edit_user.is_active %}
        <div class="alert alert-warning">
            ⚠ This user is currently <strong>inactive</strong>.
        </div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" value="{{ edit_user.username }}" readonly>
        </div>
        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" name="first_name" value="{{ edit_user.first_name }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" name="last_name" value="{{ edit_user.last_name }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" value="{{ edit_user.email }}">
        </div>

       <div class="mb-3">
    <label class="form-label">Role</label>
    <select class="form-select" name="role">
        {% for key, value in edit_user.ROLE_CHOICES %}
            <option value="{{ key }}" {% if edit_user.role == key %}selected{% endif %}>{{ value }}</option>
        {% endfor %}
    </select>
</div>

<div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if edit_user.is_active %}checked{% endif %}>
    <label class="form-check-label" for="is_active">Active</label>
</div>
   
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'user_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
